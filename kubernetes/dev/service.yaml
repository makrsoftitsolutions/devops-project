apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: dev
  labels:
    app.kubernetes.io/name: nginx-demo
    app.kubernetes.io/managed-by: containerization-assist
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
