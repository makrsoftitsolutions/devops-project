apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: dev
  labels:
    app.kubernetes.io/name: nginx-demo
    app.kubernetes.io/managed-by: containerization-assist
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ =404;
      }
    }
