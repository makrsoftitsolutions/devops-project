githubConfigUrl: https://github.com/makrsoftitsolutions/devops-project
githubConfigSecret: arc-github-app
runnerScaleSetName: arc-aks-dev
minRunners: 0
maxRunners: 1

template:
  spec:
    serviceAccountName: arc-aks-dev
    automountServiceAccountToken: true
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.1
        command:
          - /home/runner/run.sh
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
