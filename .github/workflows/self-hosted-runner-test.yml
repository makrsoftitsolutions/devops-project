
name: Windows Self Hosted Runner Validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: [self-hosted, azure-vm-runner]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Git
        shell: powershell
        run: git --version

      - name: Validate Azure CLI
        shell: powershell
        run: az version

      - name: Validate Terraform
        shell: powershell
        run: terraform version

      - name: Validate Kubernetes
        shell: powershell
        run: |
          kubectl version --client
          kubelogin --version
