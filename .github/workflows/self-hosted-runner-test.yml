
name: Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  runner-test:
    runs-on: [self-hosted, azure-vm-runner]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display runner information
        shell: powershell
        run: |
          Write-Host "Running on Azure Self Hosted Runner"
          hostname
          whoami
          Get-ComputerInfo | Select-Object WindowsProductName, OsArchitecture

      - name: Check installed tools
        shell: powershell
        run: |
          git --version
          az version
          terraform version
