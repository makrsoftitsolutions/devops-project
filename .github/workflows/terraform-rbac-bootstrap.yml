name: Terraform RBAC Bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment configuration to bootstrap
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod
        default: dev
      confirmation:
        description: Type BOOTSTRAP to create the targeted RBAC plan
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  plan-bootstrap:
    if: ${{ inputs.confirmation == 'BOOTSTRAP' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_BACKEND_RESOURCE_GROUP: ${{ vars.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ vars.TF_BACKEND_CONTAINER }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    defaults:
      run:
        working-directory: terraform/root

    steps:
      - uses: actions/checkout@v4

      - name: Verify environment configuration
        shell: bash
        run: |
          config="../environments/${TARGET_ENVIRONMENT}/terraform.tfvars"
          test -f "$config" || { echo "Missing $config"; exit 1; }
          grep -Eq "^environment[[:space:]]*=[[:space:]]*\"${TARGET_ENVIRONMENT}\"[[:space:]]*$" "$config" || {
            echo "The environment value in $config must be ${TARGET_ENVIRONMENT}."
            exit 1
          }
          config_subscription=$(sed -nE 's/^[[:space:]]*subscription_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$config" | head -n1)
          if [[ "$config_subscription" != "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "ARM_SUBSCRIPTION_ID must match subscription_id in $config."
            exit 1
          fi
          if [[ -z "$ARM_CLIENT_ID" || -z "$ARM_TENANT_ID" || -z "$TF_BACKEND_RESOURCE_GROUP" || -z "$TF_BACKEND_STORAGE_ACCOUNT" || -z "$TF_BACKEND_CONTAINER" ]]; then
            echo "Set ARM_* and TF_BACKEND_* variables for ${TARGET_ENVIRONMENT}."
            exit 1
          fi

      - uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="resource_group_name=${TF_BACKEND_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_BACKEND_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_BACKEND_CONTAINER}" \
            -backend-config="key=${TARGET_ENVIRONMENT}.terraform.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Plan bootstrap grants and prerequisites
        run: >-
          terraform plan -input=false
          -var-file="../environments/${TARGET_ENVIRONMENT}/terraform.tfvars"
          -target='module.rbac_deployment_acr_admin[0]'
          -target='module.rbac_deployment_management[0]'
          -out=rbac-bootstrap.tfplan

      - name: Show bootstrap plan
        run: terraform show -no-color rbac-bootstrap.tfplan

      - name: Verify bootstrap plan scope
        shell: bash
        run: |
          set -euo pipefail
          terraform show -json rbac-bootstrap.tfplan > rbac-bootstrap-plan.json
          if ! jq -e '
            def allowed_addresses: [
              "azurerm_resource_group.spoke",
              "module.acr[0].azurerm_container_registry.this",
              "module.aks_identity[0].azurerm_user_assigned_identity.this",
              "module.aks_kubelet_identity[0].azurerm_user_assigned_identity.this",
              "module.management_vm_identity[0].azurerm_user_assigned_identity.this",
              "module.rbac_deployment_acr_admin[0].azurerm_role_assignment.this[\"deployment_acr_rbac_admin\"]",
              "module.rbac_deployment_management[0].azurerm_role_assignment.this[\"deployment_manage_vm_roles\"]"
            ];
            [
              .resource_changes[]?
              | select(.mode == "managed")
              | select(.change.actions != ["no-op"])
              | select(
                  (.address as $address | (allowed_addresses | index($address)) == null)
                  or (.change.actions | index("delete") != null)
                )
            ] | length == 0
          ' rbac-bootstrap-plan.json > /dev/null; then
            echo "Bootstrap plan contains unexpected resource changes or deletes; review the plan and stop before apply."
            exit 1
          fi

      - name: Upload bootstrap plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.environment || 'dev' }}-rbac-bootstrap-plan
          path: terraform/root/rbac-bootstrap.tfplan
          retention-days: 1
          if-no-files-found: error

  apply-bootstrap:
    needs: plan-bootstrap
    runs-on: ubuntu-latest
    environment: ${{ format('{0}-bootstrap', inputs.environment || 'dev') }}

    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.BOOTSTRAP_ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.BOOTSTRAP_ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.BOOTSTRAP_ARM_SUBSCRIPTION_ID }}
      TF_BACKEND_RESOURCE_GROUP: ${{ vars.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ vars.TF_BACKEND_CONTAINER }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    defaults:
      run:
        working-directory: terraform/root

    steps:
      - uses: actions/checkout@v4

      - name: Verify bootstrap configuration
        shell: bash
        run: |
          config="../environments/${TARGET_ENVIRONMENT}/terraform.tfvars"
          test -f "$config" || { echo "Missing $config"; exit 1; }
          grep -Eq "^environment[[:space:]]*=[[:space:]]*\"${TARGET_ENVIRONMENT}\"[[:space:]]*$" "$config" || {
            echo "The environment value in $config must be ${TARGET_ENVIRONMENT}."
            exit 1
          }
          config_subscription=$(sed -nE 's/^[[:space:]]*subscription_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$config" | head -n1)
          if [[ "$config_subscription" != "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "BOOTSTRAP_ARM_SUBSCRIPTION_ID must match subscription_id in $config."
            exit 1
          fi
          if [[ -z "$ARM_CLIENT_ID" || -z "$ARM_TENANT_ID" || -z "$TF_BACKEND_RESOURCE_GROUP" || -z "$TF_BACKEND_STORAGE_ACCOUNT" || -z "$TF_BACKEND_CONTAINER" ]]; then
            echo "Set BOOTSTRAP_ARM_* and TF_BACKEND_* variables in the ${TARGET_ENVIRONMENT}-bootstrap GitHub Environment."
            exit 1
          fi

      - uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.BOOTSTRAP_ARM_CLIENT_ID }}
          tenant-id: ${{ vars.BOOTSTRAP_ARM_TENANT_ID }}
          subscription-id: ${{ vars.BOOTSTRAP_ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="resource_group_name=${TF_BACKEND_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_BACKEND_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_BACKEND_CONTAINER}" \
            -backend-config="key=${TARGET_ENVIRONMENT}.terraform.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Download bootstrap plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.environment || 'dev' }}-rbac-bootstrap-plan
          path: terraform/root

      - name: Apply reviewed bootstrap plan
        run: terraform apply -input=false -auto-approve rbac-bootstrap.tfplan
