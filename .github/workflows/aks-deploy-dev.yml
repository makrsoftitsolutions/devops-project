name: Build and Deploy NGINX to AKS (dev)

on:
  push:
    branches:
      - main
    paths:
      - "application/**"
      - "kubernetes/dev/**"
      - ".github/workflows/aks-deploy-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aks-deploy-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    outputs:
      image_ref: ${{ steps.infrastructure.outputs.image_ref }}

    env:
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      IMAGE_NAME: nginx-demo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read dev ACR name
        id: infrastructure
        shell: bash
        run: |
          set -euo pipefail
          config="terraform/environments/dev/terraform.tfvars"
          if [[ ! -f "$config" ]]; then
            echo "Missing $config."
            exit 1
          fi

          tfvar() {
            sed -nE "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\"([^\"]+)\".*/\1/p" "$config" | head -n1
          }

          environment=$(tfvar environment)
          subscription=$(tfvar subscription_id)
          project=$(tfvar project)
          acr_name=$(tfvar acr_name)

          if [[ "$environment" != "dev" || "$subscription" != "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "The dev environment subscription must match ARM_SUBSCRIPTION_ID."
            exit 1
          fi

          if [[ -z "$acr_name" ]]; then
            acr_name="${project}${environment}acr001"
            acr_name="${acr_name//-/}"
            acr_name="${acr_name,,}"
            acr_name="${acr_name:0:50}"
          fi
          if [[ ! "$acr_name" =~ ^[a-z0-9]{5,50}$ ]]; then
            echo "Invalid ACR name '$acr_name'."
            exit 1
          fi

          echo "acr_name=$acr_name" >> "$GITHUB_OUTPUT"
          echo "image_ref=${acr_name}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        shell: bash
        run: az acr login --name "${{ steps.infrastructure.outputs.acr_name }}"

      - name: Build and push image
        shell: bash
        env:
          ACR_NAME: ${{ steps.infrastructure.outputs.acr_name }}
          IMAGE_REF: ${{ steps.infrastructure.outputs.image_ref }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build-output.log"
          : > "$log"
          docker buildx build \
            --progress=plain \
            --push \
            --tag "$IMAGE_REF" \
            --tag "$ACR_NAME.azurecr.io/${IMAGE_NAME}:dev" \
            ./application 2>&1 | tee "$log"

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output.log
          if-no-files-found: warn
          retention-days: 1

  deploy:
    needs: build
    runs-on: arc-aks-dev
    environment: dev
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure in-cluster Kubernetes access
        shell: bash
        run: |
          set -euo pipefail
          service_account_dir=/var/run/secrets/kubernetes.io/serviceaccount
          test -r "$service_account_dir/token"
          test -r "$service_account_dir/ca.crt"

          kubeconfig="$RUNNER_TEMP/aks-dev-kubeconfig"
          cat > "$kubeconfig" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: in-cluster
            cluster:
              server: https://kubernetes.default.svc
              certificate-authority: $service_account_dir/ca.crt
          contexts:
          - name: in-cluster
            context:
              cluster: in-cluster
              user: arc-runner
              namespace: dev
          current-context: in-cluster
          users:
          - name: arc-runner
            user:
              tokenFile: $service_account_dir/token
          EOF
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy to AKS
        id: deploy
        if: needs.build.result == 'success'
        shell: bash
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          set -euo pipefail
          kubectl apply \
            -f kubernetes/dev/configmap.yaml \
            -f kubernetes/dev/deployment.yaml \
            -f kubernetes/dev/service.yaml
          kubectl set image -n dev deployment/nginx-demo nginx="$IMAGE_REF"
          kubectl rollout status -n dev deployment/nginx-demo --timeout=180s

      - name: Remove temporary kubeconfig
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/aks-dev-kubeconfig"
