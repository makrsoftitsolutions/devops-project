name: Build and Deploy NGINX to AKS (dev)

on:
  push:
    branches:
      - main
    paths:
      - "application/**"
      - "kubernetes/dev/**"
      - ".github/workflows/aks-deploy-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aks-deploy-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    outputs:
      image_ref: ${{ steps.infrastructure.outputs.image_ref }}

    env:
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      IMAGE_NAME: nginx-demo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read dev ACR name
        id: infrastructure
        shell: bash
        run: |
          set -euo pipefail
          config="terraform/environments/dev/terraform.tfvars"
          if [[ ! -f "$config" ]]; then
            echo "Missing $config."
            exit 1
          fi

          tfvar() {
            sed -nE "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\"([^\"]+)\".*/\1/p" "$config" | head -n1
          }

          environment=$(tfvar environment)
          subscription=$(tfvar subscription_id)
          project=$(tfvar project)
          acr_name=$(tfvar acr_name)

          if [[ "$environment" != "dev" || "$subscription" != "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "The dev environment subscription must match ARM_SUBSCRIPTION_ID."
            exit 1
          fi

          if [[ -z "$acr_name" ]]; then
            acr_name="${project}${environment}acr001"
            acr_name="${acr_name//-/}"
            acr_name="${acr_name,,}"
            acr_name="${acr_name:0:50}"
          fi
          if [[ ! "$acr_name" =~ ^[a-z0-9]{5,50}$ ]]; then
            echo "Invalid ACR name '$acr_name'."
            exit 1
          fi

          echo "acr_name=$acr_name" >> "$GITHUB_OUTPUT"
          echo "image_ref=${acr_name}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        shell: bash
        run: az acr login --name "${{ steps.infrastructure.outputs.acr_name }}"

      - name: Build and push image
        shell: bash
        env:
          ACR_NAME: ${{ steps.infrastructure.outputs.acr_name }}
          IMAGE_REF: ${{ steps.infrastructure.outputs.image_ref }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build-output.log"
          : > "$log"
          docker buildx build \
            --progress=plain \
            --push \
            --tag "$IMAGE_REF" \
            --tag "$ACR_NAME.azurecr.io/${IMAGE_NAME}:dev" \
            ./application 2>&1 | tee "$log"

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output.log
          if-no-files-found: warn
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.3

      - name: Get AKS credentials
        shell: bash
        run: |
          set -euo pipefail
          kubeconfig="$RUNNER_TEMP/aks-dev-kubeconfig"
          az aks get-credentials \
            --resource-group rg-platform-dev \
            --name aks-dev-platform \
            --admin \
            --file "$kubeconfig" \
            --overwrite-existing
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Install NGINX Ingress Controller
        shell: bash
        run: |
          set -euo pipefail
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --version 4.15.1 \
            --namespace ingress-nginx \
            --create-namespace \
            --set controller.service.type=LoadBalancer \
            --set controller.service.enableHttp=true \
            --set controller.service.enableHttps=false \
            --wait \
            --timeout 10m

      - name: Deploy to AKS
        id: deploy
        if: needs.build.result == 'success'
        shell: bash
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          set -euo pipefail
          kubectl apply \
            -f kubernetes/dev/namespace.yaml \
            -f kubernetes/dev/deployment.yaml \
            -f kubernetes/dev/service.yaml \
            -f kubernetes/dev/ingress.yaml
          kubectl set image -n dev deployment/nginx-demo nginx="$IMAGE_REF"
          kubectl rollout status -n dev deployment/nginx-demo --timeout=180s
          kubectl get ingress -n dev nginx-demo
          kubectl get service -n ingress-nginx ingress-nginx-controller

      - name: Remove temporary kubeconfig
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/aks-dev-kubeconfig"
