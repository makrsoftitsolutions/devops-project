name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment configuration to plan
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    defaults:
      run:
        working-directory: terraform/root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment configuration
        shell: bash
        run: |
          config="../environments/${TARGET_ENVIRONMENT}/terraform.tfvars"
          if [[ ! -f "$config" ]]; then
            echo "Missing $config. Copy the dev configuration and set values for ${TARGET_ENVIRONMENT}."
            exit 1
          fi
          grep -Eq "^environment[[:space:]]*=[[:space:]]*\"${TARGET_ENVIRONMENT}\"[[:space:]]*$" "$config" || {
            echo "The environment value in $config must be ${TARGET_ENVIRONMENT}."
            exit 1
          }
          config_subscription=$(sed -nE 's/^[[:space:]]*subscription_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$config" | head -n1)
          if [[ "$config_subscription" != "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "ARM_SUBSCRIPTION_ID must match subscription_id in $config."
            exit 1
          fi

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${TARGET_ENVIRONMENT}.terraform.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -var-file="../environments/${TARGET_ENVIRONMENT}/terraform.tfvars"
