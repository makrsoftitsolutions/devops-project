name: Build and Push NGINX Image

on:
  push:
    paths:
      - "docker/**"
      - ".github/workflows/acr-nginx-build-push.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: acr-nginx-dev
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      IMAGE_NAME: nginx-demo
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Verify ACR configuration
        shell: bash
        run: |
          if [[ -z "$ACR_NAME" ]]; then
            echo "Set the ACR_NAME variable in the GitHub dev environment."
            exit 1
          fi

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
