name: Build and Push NGINX Image

on:
  push:
    paths:
      - "docker/**"
      - ".github/workflows/acr-nginx-build-push.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment registry to push to
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: acr-build-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      IMAGE_NAME: nginx-demo
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find environment ACR name
        id: registry
        shell: bash
        run: |
          config="terraform/environments/${TARGET_ENVIRONMENT}/terraform.tfvars"
          if [[ ! -f "$config" ]]; then
            echo "Missing $config. Create the environment configuration before pushing an image."
            exit 1
          fi
          grep -Eq "^environment[[:space:]]*=[[:space:]]*\"${TARGET_ENVIRONMENT}\"[[:space:]]*$" "$config" || {
            echo "The environment value in $config must be ${TARGET_ENVIRONMENT}."
            exit 1
          }
          config_subscription=$(sed -nE 's/^[[:space:]]*subscription_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$config" | head -n1)
          if [[ "$config_subscription" != "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "The GitHub Environment subscription must match subscription_id in $config."
            exit 1
          fi

          acr_name=$(sed -nE 's/^[[:space:]]*acr_name[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$config" | head -n1)
          if [[ -z "$acr_name" ]]; then
            project=$(sed -nE 's/^[[:space:]]*project[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$config" | head -n1)
            environment=$(sed -nE 's/^[[:space:]]*environment[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$config" | head -n1)
            acr_name="${project}${environment}acr001"
            acr_name="${acr_name//-/}"
            acr_name="${acr_name,,}"
            acr_name="${acr_name:0:50}"
          fi
          if [[ ! "$acr_name" =~ ^[a-z0-9]{5,50}$ ]]; then
            echo "Invalid ACR name '$acr_name'; use 5-50 lowercase letters or digits."
            exit 1
          fi
          echo "name=$acr_name" >> "$GITHUB_OUTPUT"
          echo "Using registry $acr_name"

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ steps.registry.outputs.name }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.name }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
